[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-handle-detector"
version = "1.0.0"
description = "GitHub handle intelligence detector, exposed to AI agents over MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
